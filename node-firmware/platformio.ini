; =============================================================================
; SmartHome Unified Node Firmware Configuration
; Multi-target PlatformIO specification for ESP8266 (1MB/4MB), PCF8574 & ESP32
; =============================================================================

[platformio]
default_envs = esp8266_4m

; -----------------------------------------------------------------------------
; Target 1: ESP8266 (ESP-12E/F) NodeMCU / D1 Mini (4MB Flash, Standalone Node)
; -----------------------------------------------------------------------------
[env:esp8266_4m]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

build_flags =
    -I include
    -Os
    -fno-exceptions
    -fno-rtti
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D ARDUINOJSON_USE_DOUBLE=0
    -D ARDUINOJSON_USE_LONG_LONG=0
    -D ARDUINOJSON_ENABLE_STD_STRING=0
    -D TARGET_ESP8266_4M=1

; -----------------------------------------------------------------------------
; Target 2: ESP-01 / ESP-01S (1MB Flash, Thin-Satellite Dual-Slot OTA Guaranteed)
; -----------------------------------------------------------------------------
[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.ldscript = eagle.flash.1m.ld
board_build.flash_mode = dout
extra_scripts = post:scripts/strip_floats.py

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

build_flags =
    -I include
    -Os
    -fno-exceptions
    -fno-rtti
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
    -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK221
    -D NO_GLOBAL_MDNS
    -D NO_EXTRA_4K_MUST_HAVE_PBUF
    -D ARDUINOJSON_USE_DOUBLE=0
    -D ARDUINOJSON_USE_LONG_LONG=0
    -D ARDUINOJSON_ENABLE_STD_STRING=0
    -D ARDUINOJSON_ENABLE_STD_STREAM=0
    -D TARGET_ESP01_1M=1
    -Wl,-Map=.pio/build/esp01_1m/firmware.map

; -----------------------------------------------------------------------------
; Target 3: ESP-01 / ESP-01S + PCF8574 (1MB Flash with 8-Ch I2C Expander)
; -----------------------------------------------------------------------------
[env:esp01_pcf8574]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.ldscript = eagle.flash.1m.ld
board_build.flash_mode = dout
extra_scripts = post:scripts/strip_floats.py

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

build_flags =
    -I include
    -I src/drivers
    -Os
    -fno-exceptions
    -fno-rtti
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
    -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK221
    -D NO_GLOBAL_MDNS
    -D NO_EXTRA_4K_MUST_HAVE_PBUF
    -D ARDUINOJSON_USE_DOUBLE=0
    -D ARDUINOJSON_USE_LONG_LONG=0
    -D ARDUINOJSON_ENABLE_STD_STRING=0
    -D ARDUINOJSON_ENABLE_STD_STREAM=0
    -D TARGET_ESP01_PCF8574=1
    -D FEATURE_PCF8574=1
    -Wl,-Map=.pio/build/esp01_pcf8574/firmware.map

; -----------------------------------------------------------------------------
; Target 4: NodeMCU + PCF8574 (4MB Flash with 8-Ch I2C Expander)
; -----------------------------------------------------------------------------
[env:nodemcu_pcf8574]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

build_flags =
    -I include
    -I src/drivers
    -Os
    -fno-exceptions
    -fno-rtti
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D ARDUINOJSON_USE_DOUBLE=0
    -D ARDUINOJSON_USE_LONG_LONG=0
    -D ARDUINOJSON_ENABLE_STD_STRING=0
    -D TARGET_NODEMCU_PCF8574=1
    -D FEATURE_PCF8574=1

; -----------------------------------------------------------------------------
; Target 5: ESP32 Target (ESP32-WROOM / ESP32-DevKit)
; -----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

build_flags =
    -I include
    -fno-exceptions
    -fno-rtti
    -D TARGET_ESP32=1
