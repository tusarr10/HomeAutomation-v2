; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp8266_4m

[env:esp8266_4m]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
lib_deps = 
	bblanchon/ArduinoJson @ ^6.21.3
	crankyoldgit/IRremoteESP8266@^2.8.6
build_flags = 
	-I include
	-I src/drivers
	-Os
	-fno-exceptions
	-fno-rtti
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-D ARDUINOJSON_USE_DOUBLE=0
	-D ARDUINOJSON_USE_LONG_LONG=0
	-D ARDUINOJSON_ENABLE_STD_STRING=0
	-D TARGET_ESP8266_4M=1
	-D FEATURE_PCF8574=1
	-D _IR_ENABLE_DEFAULT_=false
	-D DECODE_NEC=true
	-D SEND_NEC=true
	-D DECODE_SAMSUNG=true
	-D SEND_SAMSUNG=true
	-D DECODE_SONY=true
	-D SEND_SONY=true
	-D DECODE_RC5=true
	-D SEND_RC5=true
	-D DECODE_PANASONIC=true
	-D SEND_PANASONIC=true
	-D DECODE_LG=true
	-D SEND_LG=true
	-D DECODE_HASH=true
	-D SEND_RAW=true

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.ldscript = eagle.flash.1m.ld
board_build.flash_mode = dout
extra_scripts = post:scripts/strip_floats.py
lib_deps = 
	bblanchon/ArduinoJson @ ^6.21.3
build_flags = 
	-I include
	-I src/drivers
	-Os
	-fno-exceptions
	-fno-rtti
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
	-D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK221
	-D NO_GLOBAL_MDNS
	-D NO_EXTRA_4K_MUST_HAVE_PBUF
	-D ARDUINOJSON_USE_DOUBLE=0
	-D ARDUINOJSON_USE_LONG_LONG=0
	-D ARDUINOJSON_ENABLE_STD_STRING=0
	-D ARDUINOJSON_ENABLE_STD_STREAM=0
	-D TARGET_ESP01_1M=1
	-Wl,-Map=.pio/build/esp01_1m/firmware.map

